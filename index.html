<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIVANTまとめ</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(90%, 640px);
      padding: 3rem 2rem;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgb(15 23 42 / 10%);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 6vw, 3rem);
    }

    p {
      margin: 0;
      line-height: 1.8;
      color: #4b5563;
    }

    section {
      margin-top: 2rem;
      text-align: left;
    }

    h2 {
      margin: 0 0 0.75rem;
      font-size: 1.25rem;
    }

    ul {
      margin: 0;
      padding-left: 1.25rem;
      color: #4b5563;
      line-height: 1.8;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <main>
    <h1>VIVANT</h1>
    <p>壮大なスケールで描かれる、謎と伏線のサスペンスドラマ。</p>

    <section>
      <h2>作品概要</h2>
      <p>
        丸菱商事の社員・乃木憂助は、1億ドルの誤送金事件をきっかけに、
        世界を舞台にした大きな陰謀へ巻き込まれていきます。
        公安、自衛隊の精鋭部隊、謎のテロ組織が交錯する中で、
        乃木の過去と本当の目的が少しずつ明らかになります。
      </p>
    </section>

    <section>
      <h2>見どころ</h2>
      <ul>
        <li>モンゴルをはじめとする海外ロケと迫力の映像</li>
        <li>登場人物の正体や関係性をめぐる巧みな伏線</li>
        <li>味方と敵が入れ替わる、先の読めない展開</li>
      </ul>
    </section>

    <footer>VIVANT作品まとめ</footer>
  </main>
</body>
</html>
