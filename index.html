<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(90%, 640px);
      padding: 3rem 2rem;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgb(15 23 42 / 10%);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 6vw, 3rem);
    }

    p {
      margin: 0;
      line-height: 1.8;
      color: #4b5563;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <main>
    <h1>こんにちは！</h1>
    <p>このサイトは GitHub Pages で公開しています。</p>
    <footer>&copy; 2026 My Website</footer>
  </main>
</body>
</html>
